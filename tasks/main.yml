---
########## SSH Hardening Tasks ##########
- name: Ensure SSH Users Exist
  ansible.builtin.user:
    name: "{{ item.user }}"
    shell: "{{ item.shell }}"
    groups: "{{ item.groups }}"
    append: true
  loop: "{{ ssh_users_and_keys }}"

- name: Add User to Wheel (RHEL)
  ansible.builtin.user:
    name: "{{ item.user }}"
    groups: wheel
    append: true
  loop: "{{ ssh_users_and_keys }}"
  when:
    - item.admin == true
    - ansible_facts['os_family'] == "RedHat"

- name: Add User to Sudo (DEB)
  ansible.builtin.user:
    name: "{{ item.user }}"
    groups: sudo
    append: true
  loop: "{{ ssh_users_and_keys }}"
  when:
    - item.admin == true
    - ansible_facts['os_family'] == "Debian"

- name: Ensure SSH Directories Exist
  ansible.builtin.file:
    path: "/home/{{ item.user }}/.ssh"
    state: directory
    owner: "{{ item.user }}"
    group: "{{ item.user }}"
    mode: '0700'
  loop: "{{ ssh_users_and_keys }}"

- name: Deploy SSH PubKeys for SSH Users
  ansible.posix.authorized_key:
    user: "{{ item.user }}"
    state: present
    key: "{{ item.key }}"
  loop: "{{ ssh_users_and_keys }}"

- name: Deploy SSH hardening config
  ansible.builtin.template:
    src: openssh-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/{{ conf_name }}.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
  register: sshd_config_changed

- name: Restart SSHD With Changes (Debian)
  ansible.builtin.systemd:
    name: ssh
    state: restarted
  when:
    - sshd_config_changed is changed
    - ansible_facts['os_family'] == "Debian"

- name: Restart SSHD With Changes (RHEL)
  ansible.builtin.systemd:
    name: sshd
    state: restarted
  when:
    - sshd_config_changed is changed
    - ansible_facts['os_family'] in ["RedHat", "Suse"]
