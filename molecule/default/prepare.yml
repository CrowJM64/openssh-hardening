---
# Purpose: install what a real server would already have (the base images ship without sshd).
# Molecule calls this playbook with `molecule prepare`.
- name: Prepare
  hosts: all
  gather_facts: true
  tasks:
    - name: Install pre-req python3-dnf (Fedora)
      ansible.builtin.command: dnf -y install python3-dnf
      changed_when: false
      when: ansible_facts['distribution'] == "Fedora"

    - name: Install OpenSSH Server and sudo (RHEL)
      ansible.builtin.dnf:
        name:
          - openssh-server
          - sudo
        state: present
      when:
        - ansible_facts['os_family'] == "RedHat"

    - name: Install OpenSSH Server and sudo (Debian)
      ansible.builtin.apt:
        name:
          - openssh-server
          - sudo
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == "Debian"

    - name: Install OpenSSH Server and sudo (Suse)
      community.general.zypper:
        name:
          - openssh-server
          - sudo
        state: present
      when: ansible_facts['os_family'] == "Suse"

    - name: Install OpenSSH Server and sudo (Other)
      ansible.builtin.package:
        name:
          - openssh-server
          - sudo
        state: present
      when:
        - ansible_facts['os_family'] not in ["RedHat", "Debian", "Suse"]

    - name: Start SSHD Service
      ansible.builtin.systemd:
        name: sshd
        state: started
        enabled: true
      when: ansible_facts['os_family'] != "Debian"

    - name: Start SSHD Service (Debian)
      ansible.builtin.systemd:
        name: ssh
        state: started
        enabled: true
      when: ansible_facts['os_family'] == "Debian"

#    - name: Create Ansible Group
#      ansible.builtin.group:
#        name: ansible
#        state: present

    - name: Ensure Wheel Group Exists (Suse)
      ansible.builtin.group:
        name: wheel
        system: true
        state: present
      when: ansible_facts['os_family'] == "Suse"