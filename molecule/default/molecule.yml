---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml

driver: {name: docker}

platforms:
  - name: rockylinux10
    image: geerlingguy/docker-rockylinux10-ansible:latest
    pre_build_image: true
    command: /sbin/init
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

  - name: rockylinux9
    image: geerlingguy/docker-rockylinux9-ansible:latest
    pre_build_image: true
    command: /sbin/init
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

  - name: fedora44
    image: geerlingguy/docker-fedora44-ansible:latest
    pre_build_image: true
    command: /sbin/init
