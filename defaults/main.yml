---
# SSH Server Config Change Defaults
conf_name: 40-openssh-hardening
allowed_ciphers: chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
allow_root_ssh: 'no' # yes/no
allow_empty_passwords: 'no' # yes/no
allow_password_auth: 'no' # yes/no
allow_pubkey_auth: 'yes' # yes/no 
allow_x11_fwd: 'no' # yes/no
client_alive_dur: 300 # Seconds to keep inactive SSH Session alive for.
allow_hostbased_auth: 'no' # yes/no
ignore_rhosts: 'yes' #yes/no
ssh_log_level: VERBOSE # QUIET, FATAL, ERROR, INFO, VERBOSE
max_auth_tries: 6 # Max Attempts per connection.
set_max_sessions: 10
set_max_startups: 10:30:100 # Start:Rate:Full - Max Unauthenticated SSH Connections. Start=Allowed Until Ratelimit, Rate is % chance of dropping subsequent connections, Full is dropping any connections past this number, e.g. 100th failed SSH Connection.
set_print_motd: 'no' # yes/no

# User SSH Defaults
ssh_users_and_keys:
  - user: ansible
    key: "ssh-ed25519 xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    groups: ansible
    shell: /bin/bash
    admin: true

